[package]
name = "rmp-gui"
version.workspace = true
edition.workspace = true
description = "A graphical front end over rmp: analyse, inspect and resynthesise"

[dependencies]
eframe = "0.36.2"
egui = "0.36.2"
egui_commonmark = { version = "0.25.0", default-features = false, features = ["pulldown_cmark"] }
egui_plot = "0.37.0"
rfd = "0.17.2"
rmp-core.workspace = true
rmp-synthesis.workspace = true
rmp-structure.workspace = true
rodio = { version = "0.22.2", default-features = false, features = ["playback", "wav", "flac", "symphonia-wav"] }
