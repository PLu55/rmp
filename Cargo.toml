[package]
name = "rmp"
version = "0.1.0"
edition = "2024"

[dependencies]
realfft = "3.5"

# The FOF definition itself. Analysis atoms are rendered by the same code that
# synthesizes them, so the two cannot drift apart.
rfofs = { path = "../rfofs" }
#rustfft = "6.4"
fftw = { version = "0.8", default-features = false, features = ["system"] }
fftw-sys = { version = "0.8", default-features = false, features = ["system"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
serde_json = "1"

[[bench]]
name = "fft"
harness = false