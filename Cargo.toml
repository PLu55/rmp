[package]
name = "rmp"
version = "0.1.0"
edition = "2024"

[dependencies]
realfft = "3.5"
rayon = "1"

# The FOF definition itself. Analysis atoms are rendered by the same code that
# synthesizes them, so the two cannot drift apart.
rfofs = { path = "../rfofs" }

# CLI, settings document, book serialisation, and soundfile I/O.
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
serde_json = "1"
flate2 = "1"
sndfile = "0.1"
#rustfft = "6.4"
fftw = { version = "0.8", default-features = false, features = ["system"] }
fftw-sys = { version = "0.8", default-features = false, features = ["system"] }
plotters = { version = "0.3.7", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "svg_backend", "all_series", "all_elements", "ab_glyph"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "fft"
harness = false

[[bench]]
name = "pursuit"
harness = false
