[package]
name = "rmp"
version = "0.1.0"
edition = "2024"

[dependencies]
realfft = "3.5"
rayon = "1"

# The FOF definition itself. Analysis atoms are rendered by the same code that
# synthesizes them, so the two cannot drift apart.
rfofs = { path = "../rfofs" }

# CLI, settings document, book serialisation, and soundfile I/O.
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
# `float_roundtrip` is not optional. serde_json's default parser is a fast path that is not
# correctly rounded: it reads 1842.6232639284315 back as ...17. Every f64 in a book goes through it
# — the energies, and now the residual bank's centre frequencies — so without this a book does not
# survive its own write/read cycle, and two books that should be identical differ in the last bit.
serde_json = { version = "1", features = ["float_roundtrip"] }
flate2 = "1"
sndfile = "0.1"
#rustfft = "6.4"
fftw = { version = "0.8", default-features = false, features = ["system"] }
fftw-sys = { version = "0.8", default-features = false, features = ["system"] }
plotters = { version = "0.3.7", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "svg_backend", "all_series", "all_elements", "ab_glyph"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "fft"
harness = false

[[bench]]
name = "pursuit"
harness = false
